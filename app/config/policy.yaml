# ULTRON politika dosyası — spec §5.2. Bu dosyayı AJAN YAZAMAZ (salt-okunur ilke).
version: 1
default_decision: deny            # tanımsız araç/komut = reddet
allowed_roots:                    # dosya araçlarının erişebileceği klasörler
  - "%USERPROFILE%\\Documents"
  - "%USERPROFILE%\\Desktop"
  - "%USERPROFILE%\\Downloads"
  - "%USERPROFILE%\\ultron_workspace"
denied_roots:                     # asla (allowed içinde olsa bile)
  - "C:\\Windows"
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "%APPDATA%\\ultron\\secrets"
  - "%USERPROFILE%\\.ssh"
shell:
  mode: allowlist                 # kara liste DEĞİL, beyaz liste (B-05)
  allowed_commands: [dir, type, where, echo, git, python, pip, node, npm, ipconfig, tasklist, whoami]
  forbid_patterns: ["-EncodedCommand", "Invoke-Expression", "iex ", "DownloadString", "Remove-Item -Recurse", "format ", "diskpart", "bcdedit", "reg add", "reg delete", "net user", "schtasks /create"]
  always_confirm: true
  timeout_seconds: 30
  max_output_chars: 4000
email:
  send: confirm_every_time
  allowed_domains_autosend: []
  daily_send_limit: 20
rate_limits:
  high_risk_per_hour: 30
  critical_per_day: 5
