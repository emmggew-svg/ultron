[project]
name = "ultron"
version = "0.1.0"
description = "ULTRON — kişisel süper asistan (Windows, yerel çalışma)"
readme = "README.md"
requires-python = "==3.12.*"
# Bağımlılık sürümleri kurulumda freeze edilip buraya sabitlenir.
dependencies = [
    "google-genai==2.30.1",
    "SpeechRecognition==3.17.0",
    "pyaudio==0.2.14",
    "psutil==7.2.2",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "pyperclip==1.11.0",
    "mss==10.2.0",
    "pyautogui==0.9.54",  # B-10: legacy requirements'ta eksikti, eklendi
    "pyyaml==6.0.3",  # policy.yaml okuma (yoksa güvenli varsayılanlara düşülür)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
