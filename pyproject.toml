[project]
name = "ultron"
version = "0.1.0"
description = "ULTRON — kişisel süper asistan (Windows, yerel çalışma)"
readme = "README.md"
requires-python = "==3.12.*"
# Bağımlılık sürümleri kurulumda freeze edilip buraya sabitlenir.
dependencies = [
    "google-genai==2.30.1",
    "SpeechRecognition==3.17.0",
    "pyaudio==0.2.14",
    "psutil==7.2.2",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "pyperclip==1.11.0",
    "mss==10.2.0",
    "pyautogui==0.9.54",  # B-10: legacy requirements'ta eksikti, eklendi
    "pyyaml==6.0.3",  # policy.yaml okuma (yoksa güvenli varsayılanlara düşülür)
    "keyring==25.7.0",  # Windows Credential Manager (B-16)
    "pywin32==312",  # keyring Windows arka ucu
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Ruff: araç sınırı geniş-except'leri bilinçli kullanır (spec §1.3.5 "çökmeyen
# sistem"; bk. DECISIONS D-07). Kalan kurallar tam açık.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLW", "RUF", "FURB"]
ignore = [
  "BLE001", "S110", "S112",  # araç sınırı dayanıklılığı (D-07)
  "RUF001", "RUF002", "RUF003",  # Türkçe 'ı' harfi "belirsiz" değildir
  "E501",  # satır uzunluğu incelemede değerlendirilir
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
